name: Refresh data and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub cron is UTC. Offset from :00 (GitHub drops/delays top-of-hour schedules under load).
    # NOTE: GitHub's scheduler has not fired for this new repo; ticker.yml is the fallback that
    # dispatches this workflow every 10 min during the session. Every 10 min (:03,:13,...) from 13:03-21:53 UTC, Mon-Fri:
    #   EDT (UTC-4): 9:00 AM - 5:50 PM ET   |   EST (UTC-5): 8:00 AM - 4:50 PM ET
    # Covers the full 9:30-4:00 session (plus post-close) in both seasons; the pipeline itself
    # only records intraday points 9:30-16:45 ET. GitHub may start scheduled runs late under load.
    - cron: "3,13,23,33,43,53 13-21 * * 1-5"
    # Final post-close snapshot: 6:33 PM EDT / 5:33 PM EST
    - cron: "33 22 * * 1-5"
permissions:
  actions: write      # lets a run (re)start the ticker fallback via workflow_dispatch
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch chains
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python scripts/fetch_flow.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "farrell-flow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flow.json data/sides.json data/volume_history.json data/daily_history.json data/timeseries
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: refresh $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase origin main && git push
      - name: Ensure schedule fallback (ticker) is running during market hours
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dow=$(TZ=America/New_York date +%u); hm=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$dow" -le 5 ] && [ "$hm" -ge 900 ] && [ "$hm" -lt 1620 ]; then
            active=$(gh run list --workflow ticker.yml --limit 10 --json status --jq '[.[]|select(.status!="completed")]|length' || echo 1)
            if [ "$active" = "0" ]; then echo "No ticker run active; starting one."; gh workflow run ticker.yml --ref main || true; else echo "Ticker active ($active)."; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
