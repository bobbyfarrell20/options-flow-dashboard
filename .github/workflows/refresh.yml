name: Refresh data and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub cron is UTC. Runs at :15 and :45 past each hour 13:00-21:59 UTC, Mon-Fri:
    #   EDT (UTC-4): 9:15 AM - 5:45 PM ET   |   EST (UTC-5): 8:15 AM - 4:45 PM ET
    # This covers the full 9:30-4:00 session plus a post-close snapshot in both seasons.
    - cron: "15,45 13-21 * * 1-5"
    # Final post-close snapshot: 6:30 PM EDT / 5:30 PM EST
    - cron: "30 22 * * 1-5"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch chains
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python scripts/fetch_flow.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "farrell-flow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flow.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: refresh $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase origin main && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
